site_name: Traefik Infrastructure Docs
site_url: https://traefik-proxy-setup.musfiqdehan.workers.dev
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - content.code.copy
    - content.code.select
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: lucide/moon
        name: Switch to light mode

nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - DNS & Domains: dns-and-domains.md
  - TLS & Certificates: tls-and-certificates.md
  - Monitoring: monitoring.md
  - Sentry Cloud: sentry-cloud.md
  - Self-Hosted Sentry: sentry-self-hosted.md
  - Routing & ADMS: routing-and-adms.md
  - Troubleshooting: troubleshooting.md