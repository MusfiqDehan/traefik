# TLS Configuration — fitssort.com + *.fitssort.com
#
# Primary: Cloudflare Origin Certificate (certs/origin.pem + origin.key).
# Fallback: Let's Encrypt DNS-01 via Cloudflare API (traefik.yml letsencrypt resolver).

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin.pem
        keyFile: /certs/origin.key
  certificates:
    - certFile: /certs/origin.pem
      keyFile: /certs/origin.key
      stores:
        - default
