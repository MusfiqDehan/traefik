# TLS Configuration
#
# Cloudflare Origin cert SAN: musfiqdehan.com + *.musfiqdehan.com (one DNS label).
# That wildcard matches fitpulse.musfiqdehan.com but NOT hellogym.fitpulse.musfiqdehan.com.
#
# IMPORTANT: Do not list origin.pem under `certificates:` — Traefik prefers it over
# the more specific Let's Encrypt file for fitpulse.musfiqdehan.com. Keep origin as
# defaultCertificate only (fallback for other *.musfiqdehan.com hosts).
#
# Nested platforms (fitpulse / supermart tenants) use LE DNS-01 via nested-platforms.yml.
# Export fitpulse wildcard to certs/fitpulse-le.{pem,key} after issue/renew (see scripts/).

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin.pem
        keyFile: /certs/origin.key
  certificates:
    - certFile: /certs/fitpulse-le.pem
      keyFile: /certs/fitpulse-le.key
      stores:
        - default
