# ─────────────────────────────────────────────
# TLS Configuration
# Covers: fitssort.com + *.fitssort.com
#
# Certificates are issued automatically via Let's Encrypt ACME
# (DNS-01 challenge with Hostinger) configured in traefik.yml.
#
# To use a Cloudflare origin certificate instead, place the
# cert files in ./certs/ and uncomment the blocks below:
#
# tls:
#   stores:
#     default:
#       defaultCertificate:
#         certFile: /certs/origin.pem
#         keyFile: /certs/origin.key
#   certificates:
#     - certFile: /certs/origin.pem
#       keyFile: /certs/origin.key
#       stores:
#         - default
# ─────────────────────────────────────────────
