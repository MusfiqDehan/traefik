# TLS Configuration
#
# Platform domains:
#   musfiqdehan.com (apex + single-label *.musfiqdehan.com via origin cert)
#   *.shop / *.fitness.musfiqdehan.com — NOT covered by origin *.musfiqdehan.com;
#     use Let's Encrypt DNS-01 (see dynamic/nested-platforms.yml)
#   mrdfit.uk, mrderp.uk, mrdhrms.uk, mrdlms.uk (+ wildcard tenant subdomains)
#
# Primary: Cloudflare Origin Certificate(s) in certs/.
# Fallback: Let's Encrypt DNS-01 via Cloudflare API (traefik.yml letsencrypt resolver).
#
# Default cert below covers musfiqdehan.com / *.musfiqdehan.com (one label).
# Nested hosts like client1.shop.musfiqdehan.com require LE (nested-platforms.yml).

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin.pem
        keyFile: /certs/origin.key
  certificates:
    - certFile: /certs/origin.pem
      keyFile: /certs/origin.key
      stores:
        - default
