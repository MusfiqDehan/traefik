# ─────────────────────────────────────────────
# Nested platforms: *.supermart / *.fitpulse.musfiqdehan.com
#
# Cloudflare Origin certs for *.musfiqdehan.com cover only ONE DNS label
# (e.g. supermart.musfiqdehan.com), NOT client1.supermart.musfiqdehan.com.
#
# This low-priority router pre-issues Let's Encrypt wildcards via DNS-01
# (letsencrypt resolver + CF_DNS_API_TOKEN). Application routers with higher
# priority take over traffic; this router is cert bootstrap / unmatched fallback.
# ─────────────────────────────────────────────

http:
  routers:
    nested-platforms-le-wildcard:
      rule: HostRegexp(`^([a-z0-9][a-z0-9-]*\.)?(supermart|fitpulse)\.musfiqdehan\.com$`)
      entryPoints:
        - websecure
      service: nested-platforms-le-noop@file
      priority: 1
      tls:
        certResolver: letsencrypt
        domains:
          - main: supermart.musfiqdehan.com
            sans:
              - "*.supermart.musfiqdehan.com"
          - main: fitpulse.musfiqdehan.com
            sans:
              - "*.fitpulse.musfiqdehan.com"

  services:
    nested-platforms-le-noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:65535"
