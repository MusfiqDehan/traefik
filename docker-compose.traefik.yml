# ─────────────────────────────────────────────────────────────────────────────
# Traefik v3.6 — Reverse Proxy
#
# Usage (from repo root):
#   docker compose -f traefik/docker-compose.traefik.yml up -d
#
# This MUST be started before the backend and frontend stacks.
# It owns the `traefik_proxy` external network that both stacks attach to.
#
# Cert placement:
#   Copy Cloudflare origin cert files into ./traefik/certs/
#     origin.pem  — public cert (wildcard *.musfiqdehan.com)
#     origin.key  — private key
# ─────────────────────────────────────────────────────────────────────────────

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP → redirects to HTTPS
      - "443:443"   # HTTPS
    volumes:
      # Docker socket (read-only — label discovery only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Static configuration
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic configuration (TLS + middlewares)
      - ./dynamic:/etc/traefik/dynamic:ro
      # Cloudflare origin certificates
      - ./certs:/certs:ro
    networks:
      - traefik_proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  traefik_proxy:
    name: traefik_proxy
    driver: bridge
