# ─────────────────────────────────────────────────────────────────────────────
# Traefik v3.6 — Reverse Proxy
#
# Usage (from repo root):
#   docker compose -f shared/traefik/docker-compose.traefik.yml up -d
#
# This MUST be started before the backend and frontend stacks.
# It owns the `traefik_proxy` external network that both stacks attach to.
#
# Cert placement:
#   Copy Cloudflare origin cert files into ./shared/traefik/certs/
#     origin.pem  — public cert (wildcard *.musfiqdehan.com)
#     origin.key  — private key
#
# Let's Encrypt fallback:
#   Export CF_DNS_API_TOKEN or pass --env-file shared/traefik/.env when starting Traefik.
# ─────────────────────────────────────────────────────────────────────────────

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP (ACME + ADMS + explicit redirect routers)
      - "443:443"   # HTTPS
      - "4000:4000" # makeover-api entrypoint (NestJS + socket.io, HTTP)
    environment:
      # Required only when the Let's Encrypt DNS-01 fallback needs to issue or renew certificates.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    volumes:
      # Docker socket (read-only — label discovery only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Static configuration
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic configuration (TLS + middlewares)
      - ./dynamic:/etc/traefik/dynamic:ro
      # Optional origin certificates
      - ./certs:/certs:ro
      # Persistent ACME account and certificates for Let's Encrypt fallback
      - traefik_letsencrypt:/letsencrypt
    dns:
      - "8.8.8.8"
      - "1.1.1.1"
    networks:
      - traefik_proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    name: traefik_proxy
    driver: bridge

volumes:
  traefik_letsencrypt:
