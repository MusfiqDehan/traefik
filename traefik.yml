# ─────────────────────────────────────────────
# Traefik v3 — Static Configuration
# Domain: musfiqdehan.com
# ─────────────────────────────────────────────

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ── Logging ──────────────────────────────────
log:
  level: INFO
  format: common

accessLog:
  format: common

# ── API / Dashboard (disabled in prod) ───────
api:
  dashboard: false
  insecure: false

# ── Entry Points ─────────────────────────────
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    # Trust Cloudflare proxy IPs so X-Forwarded-For / X-Forwarded-Proto
    # headers reach Django correctly (SECURE_PROXY_SSL_HEADER).
    forwardedHeaders:
      trustedIPs:
        # Cloudflare IPv4
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "108.162.192.0/18"
        - "131.0.72.0/22"
        - "141.101.64.0/18"
        - "162.158.0.0/15"
        - "172.64.0.0/13"
        - "173.245.48.0/20"
        - "188.114.96.0/20"
        - "190.93.240.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        # Cloudflare IPv6
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

# ── Providers ────────────────────────────────
providers:
  # Docker: auto-discover services via container labels
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    # Only route containers on this network
    network: traefik_proxy

  # File: static TLS cert + middleware definitions
  file:
    directory: /etc/traefik/dynamic
    watch: true
