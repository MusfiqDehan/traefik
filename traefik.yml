# ─────────────────────────────────────────────
# Traefik v3 — Static Configuration
# Domain: fitssort.com
# ─────────────────────────────────────────────

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ── Logging ──────────────────────────────────
log:
  level: INFO
  format: common

accessLog:
  format: common

# ── API / Dashboard (disabled in prod) ───────
api:
  dashboard: false
  insecure: false

ping: {}

# ── Entry Points ─────────────────────────────
entryPoints:
  web:
    address: ":80"

  websecure:
    address: ":443"
    # Trust Cloudflare proxy IPs so X-Forwarded-For / X-Forwarded-Proto
    # headers reach Django correctly (SECURE_PROXY_SSL_HEADER).
    forwardedHeaders:
      trustedIPs:
        # Cloudflare IPv4
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "108.162.192.0/18"
        - "131.0.72.0/22"
        - "141.101.64.0/18"
        - "162.158.0.0/15"
        - "172.64.0.0/13"
        - "173.245.48.0/20"
        - "188.114.96.0/20"
        - "190.93.240.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        # Cloudflare IPv6
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

  # ── Makeover app — IP-based, HTTP only (no domain / no TLS) ────────────────
  # Used by makeover-server and makeover-client stacks via Docker labels.
  # Adding these entrypoints requires a one-time Traefik container recreation:
  #   docker compose -f docker-compose.traefik.yml up -d
  # The existing web/websecure routes are unaffected after the ~10s restart.
  makeover-client:
    address: ":3000"   # Next.js frontend

  makeover-api:
    address: ":4000"   # NestJS backend + socket.io WebSocket

# ── Certificate Resolvers ───────────────────
# Cloudflare Origin Certificates in dynamic/tls.yml are used when present.
# Routers can fall back to this ACME resolver when no matching origin cert is loaded.
certificatesResolvers:
  letsencrypt:
    acme:
      email: musfiqdehan@gmail.com
      storage: /letsencrypt/acme.json
      keyType: EC256
      dnsChallenge:
        provider: hostinger
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

  # On-demand certs for tenant-owned custom domains (arbitrary zones we do not
  # control). Uses the HTTP-01 challenge so each verified custom domain can get
  # its own Let's Encrypt cert when it first points at this proxy. App-layer
  # gating (only verified Domain rows resolve to a tenant) limits issuance.
  customdomains:
    acme:
      email: musfiqdehan@gmail.com
      storage: /letsencrypt/acme-customdomains.json
      keyType: EC256
      httpChallenge:
        entryPoint: web

# ── Providers ────────────────────────────────
providers:
  # Docker: auto-discover services via container labels
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    # Only route containers on this network
    network: traefik_proxy

  # File: static TLS cert + middleware definitions
  file:
    directory: /etc/traefik/dynamic
    watch: true
